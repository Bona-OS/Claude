.ffv-box {
  font-family: 'Press Start 2P', monospace;
  font-size: 11px;
  line-height: 1.8;
  color: #f3e9d2;
  background: linear-gradient(180deg, #274b8a 0%, #16203a 100%);
  border: 3px solid #f2f2fa;
  outline: 2px solid #16203a;
  border-radius: 6px;
  padding: 10px 14px;
  text-shadow: 2px 2px 0 #16203a;
  box-shadow: 0 4px 0 rgba(0, 0, 0, .45);
}
.hidden { display: none !important; }

/* ---------- layout do HUD ---------- */
#hud-top {
  position: absolute; top: 12px; left: 12px; right: 12px;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
}
#hud-objective { max-width: 56%; }
#hud-status { white-space: nowrap; }

#hud-party {
  position: absolute; top: 76px; left: 12px;
  display: flex; flex-direction: column; gap: 4px;
}
#hud-party .portrait {
  font-size: 8px; padding: 4px 8px; opacity: .65;
  display: flex; align-items: center; gap: 6px;
}
#hud-party .portrait.active {
  opacity: 1;
  border-color: #f0b46a;
  background: linear-gradient(180deg, #3a6fd8 0%, #274b8a 100%);
}
#hud-party .dot {
  width: 8px; height: 8px; display: inline-block;
  border: 1px solid #16203a;
}

/* ---------- mensagem (caixa de diálogo FFV) ---------- */
#hud-message {
  position: absolute; bottom: 5%; left: 50%; transform: translateX(-50%);
  max-width: 84%; min-width: 40%;
  text-align: center;
  font-size: 10px;
}
#hud-message.danger { color: #ffb09a; border-color: #c0392b; }

/* ---------- vinheta de perigo ---------- */
#danger-vignette {
  position: absolute; inset: 0; pointer-events: none;
  box-shadow: inset 0 0 180px 80px rgba(120, 10, 0, .85);
  opacity: 0; transition: opacity .6s;
}
#danger-vignette.active { opacity: 1; }

/* ---------- cartão de intro de fase ---------- */
#hud-card {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: rgba(10, 6, 16, .55);
  background-size: cover; background-position: center;
  image-rendering: pixelated;
}
#hud-card .card-inner { text-align: center; max-width: 560px; padding: 26px 34px; }
#hud-card .card-type { font-size: 9px; color: #f0b46a; letter-spacing: 2px; margin-bottom: 10px; }
#hud-card .card-name { font-size: 18px; margin-bottom: 14px; }
#hud-card .card-objective { font-size: 9px; line-height: 2.1; color: #a8c8f8; margin-bottom: 16px; }
#hud-card .card-hint { font-size: 9px; color: #f3e9d2; animation: blink 1.1s step-end infinite; }

/* ---------- resultado ---------- */
#hud-result {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: rgba(10, 6, 16, .6);
  background-size: cover; background-position: center;
  image-rendering: pixelated;
}
#hud-result .result-inner { text-align: center; max-width: 600px; padding: 28px 36px; }
#hud-result .result-title { font-size: 17px; color: #f0b46a; margin-bottom: 14px; }
#hud-result .result-text { font-size: 9px; line-height: 2.2; color: #f3e9d2; margin-bottom: 16px; }
#hud-result .result-hint { font-size: 9px; color: #a8c8f8; animation: blink 1.1s step-end infinite; }

@keyframes blink { 50% { opacity: .25; } }

/* ---------- cartão de título ---------- */
#title-card {
  position: fixed; top: 8%; left: 50%; transform: translateX(-50%);
  text-align: center; pointer-events: none;
  font-family: 'Press Start 2P', monospace;
  color: #f3e9d2;
  text-shadow: 3px 3px 0 #16203a;
  transition: opacity 1.2s;
  z-index: 5;
}
#title-card h1 { font-size: 26px; letter-spacing: 2px; color: #f0b46a; }
#title-card .sub { font-size: 9px; margin-top: 10px; color: #e8945a; }
#title-card .credits { font-size: 8px; margin-top: 8px; color: #a8c8f8; }
#title-card .howto {
  margin-top: 18px; font-size: 8px; line-height: 2.4; color: #f3e9d2;
  background: linear-gradient(180deg, #274b8a 0%, #16203a 100%);
  border: 3px solid #f2f2fa; border-radius: 6px; padding: 10px 16px;
}
#title-card.fade { opacity: 0; }
