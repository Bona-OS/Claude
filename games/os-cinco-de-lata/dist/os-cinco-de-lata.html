<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Os Cinco de Lata — A Barra de Ferro</title>
  <style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body { width: 100%; height: 100%; overflow: hidden; background: #1a0e06; }

#game { position: fixed; inset: 0; display: block; }

/* ---------- HUD ---------- */
#hud {
  position: fixed; top: 0; left: 0; right: 0;
  display: flex; justify-content: space-between; align-items: flex-start;
  padding: 16px 22px;
  pointer-events: none;
  font-family: Georgia, 'Times New Roman', serif;
  text-shadow: 0 2px 6px rgba(0,0,0,.8);
}

#shards {
  color: #f3e9d2; font-size: 20px; letter-spacing: .5px;
  background: rgba(20, 10, 4, .45);
  border: 1px solid rgba(243, 233, 210, .25);
  border-radius: 8px; padding: 8px 14px;
}
#shards .icon { color: #e8e8f0; }

#hearts {
  color: #c0392b; font-size: 24px; letter-spacing: 4px;
  background: rgba(20, 10, 4, .45);
  border: 1px solid rgba(243, 233, 210, .25);
  border-radius: 8px; padding: 6px 14px;
}

/* ---------- Mensagens (falas / avisos) ---------- */
#message {
  position: fixed; bottom: 7%; left: 50%; transform: translateX(-50%);
  max-width: 80%;
  font-family: Georgia, serif; font-size: 22px; font-style: italic;
  color: #f8efdc; text-align: center;
  text-shadow: 0 2px 8px rgba(0,0,0,.9);
  background: rgba(20, 10, 4, .55);
  border-left: 3px solid #a64b2a;
  padding: 10px 22px; border-radius: 6px;
  opacity: 0; transition: opacity .4s;
  pointer-events: none;
}
#message.show { opacity: 1; }
#message.danger { color: #ffb09a; border-left-color: #e74c3c; font-weight: bold; font-style: normal; }

/* ---------- Vinheta de perigo (sombra do pássaro) ---------- */
#danger-vignette {
  position: fixed; inset: 0; pointer-events: none;
  box-shadow: inset 0 0 180px 80px rgba(120, 10, 0, .85);
  opacity: 0; transition: opacity .6s;
}
#danger-vignette.active { opacity: 1; }

/* ---------- Cartão de título (não bloqueia o jogo) ---------- */
#title-card {
  position: fixed; top: 10%; left: 50%; transform: translateX(-50%);
  text-align: center; pointer-events: none;
  font-family: Georgia, serif; color: #f3e9d2;
  text-shadow: 0 3px 12px rgba(0,0,0,.9);
  transition: opacity 1.2s;
}
#title-card h1 {
  font-size: 54px; letter-spacing: 6px; text-transform: uppercase;
  color: #e9dcc0;
}
#title-card .sub { font-size: 20px; font-style: italic; color: #d9a05b; margin-top: 4px; }
#title-card .credits { font-size: 14px; color: #b89f7e; margin-top: 8px; }
#title-card .howto {
  margin-top: 22px; font-size: 16px; line-height: 1.7; color: #efe5cf;
  background: rgba(20, 10, 4, .5); border-radius: 10px; padding: 12px 20px;
}
#title-card.fade { opacity: 0; }

/* ---------- Tela final ---------- */
#endscreen {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  background: rgba(12, 6, 2, .82);
  background-size: cover; background-position: center;
  transition: opacity .8s; z-index: 10;
}
#endscreen.hidden { opacity: 0; pointer-events: none; }
#endscreen .end-inner {
  text-align: center; font-family: Georgia, serif; color: #f3e9d2;
  background: rgba(18, 9, 3, .78);
  border: 1px solid rgba(217, 160, 91, .4);
  border-radius: 14px; padding: 42px 56px; max-width: 640px;
  text-shadow: 0 2px 8px rgba(0,0,0,.8);
}
#endscreen h2 { font-size: 40px; letter-spacing: 3px; margin-bottom: 16px; color: #e9dcc0; }
#endscreen p { font-size: 19px; font-style: italic; line-height: 1.7; color: #e5d7ba; }
#restart {
  margin-top: 28px; padding: 12px 34px;
  font-family: Georgia, serif; font-size: 18px; letter-spacing: 1px;
  color: #1a0e06; background: #d9a05b; border: none; border-radius: 8px;
  cursor: pointer; transition: background .2s;
}
#restart:hover { background: #e9bc7e; }

</style>
  
</head>
<body>
  <canvas id="game"></canvas>

  <!-- HUD -->
  <div id="hud">
    <div id="shards"><span class="icon">✦</span> Lascas de prata: <span id="shard-count">0</span>/5</div>
    <div id="hearts">❤❤❤</div>
  </div>
  <div id="message"></div>
  <div id="danger-vignette"></div>

  <!-- Título não-bloqueante: o jogo já está rodando atrás -->
  <div id="title-card">
    <h1>Os Cinco de Lata</h1>
    <p class="sub">A Barra de Ferro</p>
    <p class="credits">baseado no livro de Pedro de Jesus Ceni Bedin</p>
    <p class="howto">WASD / setas — mover &nbsp;·&nbsp; Shift — correr &nbsp;·&nbsp; Espaço — pular<br/>
    Colete as <b>5 lascas de prata</b> e chegue ao fim da barra.<br/>
    Quando Ávio gritar <b>“SOMBRA!”</b>, esconda-se num buraco de rebite.</p>
  </div>

  <!-- Fim de jogo -->
  <div id="endscreen" class="hidden">
    <div class="end-inner">
      <h2 id="end-title"></h2>
      <p id="end-text"></p>
      <button id="restart">Jogar de novo</button>
    </div>
  </div>
